# Fly.io — SlotLock demo
# Cambiá `app` si el nombre ya está tomado.
app = "slotlock-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.prod"

[env]
  APP_NAME = "SlotLock"
  APP_ENV = "production"
  APP_DEBUG = "false"
  DB_CONNECTION = "pgsql"
  LOG_CHANNEL = "stderr"
  MAIL_MAILER = "log"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[deploy]
  release_command = "sh -c 'php artisan migrate --force && php artisan db:seed --force'"
