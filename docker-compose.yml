x-app-base: &app-base
  build:
    context: .
    dockerfile: docker/php/Dockerfile
  image: slotlock/php:local
  restart: unless-stopped
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:8000}
    HOST_UID: ${HOST_UID:-1000}
    HOST_GID: ${HOST_GID:-1000}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-slotlock}
      POSTGRES_USER: ${DB_USERNAME:-slotlock}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slotlock}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-slotlock} -d ${DB_DATABASE:-slotlock}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    <<: *app-base
    command: ["php-fpm"]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Ejecuta `schedule:work`: expira holds y poda claves de idempotencia.
  scheduler:
    <<: *app-base
    entrypoint: ["php", "artisan", "schedule:work"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"

  # Opcional: interfaz web para inspeccionar la DB durante desarrollo
  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@slotlock.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    profiles: ["tools"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    name: slotlock-pgdata
