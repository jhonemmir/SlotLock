; Pool de PHP-FPM para la demo y para las pruebas de carga.
; pm.max_children acota la concurrencia real que puede generar k6.
[www]
; El default de la imagen escucha en 127.0.0.1:9000 (solo loopback);
; nginx corre en otro contenedor, así que hay que abrir la interfaz.
listen = 0.0.0.0:9000
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500
catch_workers_output = yes
